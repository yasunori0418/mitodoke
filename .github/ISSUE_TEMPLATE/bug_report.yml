name: バグ報告
description: CLI（起票・検査・生成・確認の記録）の不具合を報告する
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きているか。期待と実際のズレを一言で。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      description: mitodoke.yaml の設定・対象の文書・実行コマンド（mitodoke check / mitodoke fresh など）を含めて、最小再現を書く。
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 実行環境
      description: mitodoke と sara の版、nix --version、対象 OS、導入の形態（Nix flake の package / devShell など）。flake.lock の関連 input rev があれば。
      render: shell
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: 関連する item（任意）
      description: 欠陥を露見させたテストケース（docs/test/）や、反している要件・設計（docs/requirements/・docs/design/）が分かる場合はパスを書く。分からなければ空欄でよい。メンテナが triage で補う。
    validations:
      required: false
