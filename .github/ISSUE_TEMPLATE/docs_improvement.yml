name: ドキュメント改善
description: README・コンセプト・item・ADR・規範・運用文書の誤り・不整合・分かりにくさ
labels: ["documentation", "needs-triage"]
body:
  - type: dropdown
    id: target
    attributes:
      label: 対象ドキュメント
      multiple: true
      options:
        - docs/mitodoke-concept.md・docs/mitodoke-concept.ja.md（コンセプト）
        - docs/solution/・docs/use-cases/
        - docs/requirements/・docs/design/
        - docs/quality/・docs/infrastructure/
        - docs/risks/・docs/test/・docs/test-plan/
        - docs/adr/
        - docs/ubiquitous-language/
        - docs/agents/（運用文書）
        - README.md・README.ja.md
        - その他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 問題点
      description: どこが誤っている / 不整合 / 分かりにくいか。該当箇所を引用すると早い。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 改善案
      description: どう直すべきか。
    validations:
      required: false
